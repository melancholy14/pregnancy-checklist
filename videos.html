olors\",\"children\":\"개인정보처리방침\"}],[\"$\",\"span\",null,{\"children\":\"|\"}],[\"$\",\"$L6\",null,{\"href\":\"/terms\",\"className\":\"underline underline-offset-2 hover:text-foreground transition-colors\",\"children\":\"서비스 이용약관\"}],[\"$\",\"span\",null,{\"children\":\"|\"}],[\"$\",\"$L6\",null,{\"href\":\"/about\",\"className\":\"underline underline-offset-2 hover:text-foreground transition-colors\",\"children\":\"서비스 소개\"}],[\"$\",\"span\",null,{\"children\":\"|\"}],[\"$\",\"$L6\",null,{\"href\":\"/contact\",\"className\":\"underline underline-offset-2 hover:text-foreground transition-colors\",\"children\":\"연락처\"}]]}]]}],[\"$\",\"$L7\",null,{}]]}],[\"$\",\"$L8\",null,{\"position\":\"top-center\",\"richColors\":true,\"theme\":\"light\",\"visibleToasts\":3}],[\"$\",\"$L9\",null,{}],[\"$\",\"$La\",null,{}],[\"$\",\"$Lb\",null,{}],[\"$\",\"$Lc\",null,{\"articles\":[{\"title\":\"임산부 수면 자세 가이드 | 임신 후기 숙면 체크리스트\",\"description\":\"임신 후기 권장 수면 자세는 좌측위만이 아니에요. ACOG와 Tommy's는 좌·우 측와위 모두 OK라고 말해요. 28주차 임산부가 직접 정리한 권장 수면 7~9시간, 자다 깨는 4가지 원인(빈뇨·다리 쥐·역류·태동) 대응법과 베개 활용 가이드까지 한 번에 안내해요.\",\"slug\":\"pregnancy-sleep-positions-guide\",\"tags\":[\"임산부 수면 자세\",\"임신 후기 숙면\",\"좌측위 수면\",\"임산부 베개\",\"임산부 불면증\",\"임신 28주\"],\"date\":\"2026-05-27\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[28,36],\"authorNote\":\"28주차 들어서고부터 수면 자세 신경 쓰는 게 영 어렵더라고요. 옆으로 잠들어도 깨보면 똑바로 누워 있을 때가 많아서 '왼쪽으로만 자야 한다'는 말이 부담이 됐어요. 1차 소스를 직접 찾아보니 생각보다 자유롭더라고요. 그 정리를 글로 옮겼어요.\",\"canonical\":\"https://pregnancy-checklist.com/articles/pregnancy-sleep-positions-guide\"},{\"title\":\"2026년 출산휴가·육아휴직 정책 총정리 — 급여·기간·신청 절차부터 맞벌이 부부 최적 조합까지\",\"description\":\"2026년 출산전후휴가·배우자 출산휴가·육아휴직의 급여 상한, 기간, 신청 절차를 한 글에 정리했어요. 1~3개월 250만 원·4~6개월 200만 원 구간별 급여와 6+6 부모육아휴직제, 맞벌이 부부가 최대 4,960만 원까지 받는 조합 시나리오 시뮬레이션까지 담았습니다.\",\"slug\":\"2026-parental-leave-guide\",\"tags\":[\"출산휴가\",\"육아휴직\",\"2026년정책\",\"맞벌이\",\"육아휴직급여\"],\"date\":\"2026-05-22\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[],\"authorNote\":\"육아휴직 신청하려고 정리하다 보니 글이 됐어요. 제도가 매년 바뀌어서 2026년 기준으로 꼼꼼하게 정리했습니다.\",\"canonical\":\"https://pregnancy-checklist.com/articles/2026-parental-leave-guide\"},{\"title\":\"베이비페어 200% 활용법 체크리스트 | 가기 전 준비부터 현장 꿀팁까지\",\"description\":\"베이비페어 처음 가시나요? 베페·코베 차이, 2026년 일정, 사전등록 무료 입장 방법, 임신 시기별 우선순위 매트릭스, 현장 한정특가 진위 판단법, 사면 후회하는 품목까지 정리했어요. 사전등록만 해도 1만원 입장료가 무료, 산모수첩 챙기면 임산부 사은품도 받을 수 있어요.\",\"slug\":\"babyfair-survival-guide\",\"tags\":[\"베이비페어\",\"베페\",\"코베\",\"출산준비\",\"임산부쇼핑\",\"사전등록\"],\"date\":\"2026-05-17\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[16,24,32],\"authorNote\":\"베이비페어 가기 전에 '뭘 챙기지, 뭘 사지, 진짜 싼 거 맞나' 막막했어요. 후기 글들이 다 비슷한 팁만 반복해서, 일정·비교·시기별 매트릭스까지 직접 정리했습니다.\",\"canonical\":\"https://pregnancy-checklist.com/articles/babyfair-survival-guide\"},{\"title\":\"산후조리원 어떻게 고르지? 비교 기준 7가지와 임신 주차별 예약 캘린더\",\"description\":\"산후조리원 어떻게 고르지 막막하셨죠? 간호사 1인당 아기 비율 등 비교 기준 7가지, 임신 8주부터 잔금까지 주차별 예약 캘린더, 전국 평균 372만원·서울 특실 810만원 가격 정보, 2026년 서울형 산후조리경비 100만원 신청 방법까지 정리했어요.\",\"slug\":\"postpartum-care-center-guide\",\"tags\":[\"산후조리원\",\"산후조리원선택\",\"산후조리원예약\",\"산후조리경비\",\"출산준비\"],\"date\":\"2026-05-09\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[10,14,16],\"authorNote\":\"산후조리원 알아보다 보니 어떤 글은 시설을 강조하고, 어떤 글은 가격을 강조하더라고요. 정작 '언제 뭘 해야 하는지'를 주차별로 정리해 둔 글이 없어서 직접 정리했어요.\",\"canonical\":\"https://pregnancy-checklist.com/articles/postpartum-care-center-guide\"},{\"title\":\"운동 안 하던 임산부도 안전하게 시작하는 4주 플랜 — 강도, 시기, 중단 신호까지\",\"description\":\"임산부 운동, 어디서부터 시작해야 할지 막막하다면. 운동 안 하던 분도 따라 할 4주 점진 시작 플랜으로 주 150분 도달, 대화 가능 테스트로 강도 자가 측정, 의사에게 꼭 물어야 할 5가지 질문, 시기별 주의·즉시 중단 신호까지 ACOG·JKMA 권고에 맞춰 행동 가능한 형태로 정리했어요.\",\"slug\":\"pregnancy-exercise-starter-guide\",\"tags\":[\"임산부운동\",\"임산부운동가이드\",\"산전운동\",\"임산부필라테스\",\"임산부\"],\"date\":\"2026-05-05\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[12,16,28],\"authorNote\":\"임신하고 나서 '운동해라' 정보는 넘치는데 '오늘 뭘 어떻게 시작하라'는 정보는 없더라고요. 권장 수치만 던지지 않고, 의사 면담 질문 5가지·4주 점진 플랜·대화 가능 테스트까지 행동 가능한 형태로 정리했어요.\",\"canonical\":\"https://pregnancy-checklist.com/articles/pregnancy-exercise-starter-guide\"},{\"title\":\"임산부 영양제 가이드: 엽산·철분·오메가3 주차별 복용 타임라인\",\"description\":\"임신 주차별로 엽산·철분·오메가3를 언제 시작하고 끊어야 하는지, 권장량과 충돌 회피 시간대 스케줄까지 한 글에 정리했어요. 엽산 1일 620㎍·12주까지, 철분 16주부터 24mg, 오메가3 14주 이후 DHA 200mg과 출산 2주 전 EPA 점검 기준을 근거와 함께 풀어드립니다.\",\"slug\":\"pregnancy-supplements-by-week\",\"tags\":[\"임신영양제\",\"엽산\",\"철분\",\"오메가3\",\"임산부\"],\"date\":\"2026-05-03\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[4,12,16],\"authorNote\":\"인터넷에서 임산부 영양제로 검색하고 나서도 한참 헤맸어요. 글마다 권장량과 시작 시기가 조금씩 달라서 GPT로도 검색하며 정리해봤지만, 글 하나로 한눈에 보고 싶었던 정보를 모아봤어요.\",\"canonical\":\"https://pregnancy-checklist.com/articles/pregnancy-supplements-by-week\"},{\"title\":\"임신 중 금지 음식 vs 주의 음식, 식약처·산부인과 기준으로 정리\",\"description\":\"임신 중 먹으면 안 되는 음식, 어디까지가 진짜 위험이고 어디까지가 한식 미신일까요? 식약처·질병관리청·CDC 기준으로 '절대 금지 / 양만 조절 / 한식 미신' 3분류로 나누고, 카페인 200mg·생선 주 400g·홍삼·고용량 비타민A 주의까지 구체 수치로 정리했어요.\",\"slug\":\"pregnancy-foods-to-avoid\",\"tags\":[\"임신초기\",\"임신중기\",\"임신음식\",\"임산부카페인\",\"임산부생선\",\"임신금기음식\"],\"date\":\"2026-05-02\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[4,5,8,12,13,17,18,19,21,22,24,25,26],\"authorNote\":\"주변에서 '이거 먹으면 안 된대' 정보가 너무 쏟아져서 혼란스러웠어요. 그래서 한방 미신·블로그 풍문 말고 식약처·질병관리청 같은 공식 자료 기준으로만 정리해봤어요.\",\"canonical\":\"https://pregnancy-checklist.com/articles/pregnancy-foods-to-avoid\"},{\"title\":\"2026년 임신·출산 정부 혜택 총정리: 국민행복카드 100만원부터 부모급여·교통비까지\",\"description\":\"2026년 임신·출산 정부 혜택을 시점별로 정리했어요. 국민행복카드 발급부터 다태아 태아당 100만원 진료비 바우처, 첫만남이용권, 부모급여 월 100만원, 서울시 임산부 교통비, 지자체 출산지원금까지. 신청 마감일·카드사별 사은품 차이도 한 번에 확인하세요.\",\"slug\":\"pregnancy-government-benefits-2026\",\"tags\":[\"국민행복카드\",\"임신지원금\",\"부모급여\",\"첫만남이용권\",\"정부지원\",\"2026년\"],\"date\":\"2026-05-01\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[10],\"authorNote\":\"임신 확인하자마자 받는 첫 숙제가 '국민행복카드 신청'이에요. 그런데 카드사부터 사은품, 신청 시점까지 알아볼 게 너무 많아서 정리해봤습니다.\",\"canonical\":\"https://pregnancy-checklist.com/articles/pregnancy-government-benefits-2026\"},{\"title\":\"임신 중기(13~27주) 생활 가이드 — 운동·영양·검사·여행까지 한 번에 정리\",\"description\":\"입덧 끝나고 '안정기'라는데, 뭘 해야 할지 막막하죠? 임산부 운동 권고량(주 150분), 핵심 영양소 5종(철분 24mg·엽산·칼슘·비타민D·DHA) 수치, 정밀초음파·임당 검사 최적 시기, 여행·수면 팁까지 — 임신 중기(13~27주) 생활 영역별로 필요한 것만 한 글에 정리했어요.\",\"slug\":\"mid-pregnancy-lifestyle-guide\",\"tags\":[\"임신중기\",\"임산부운동\",\"임산부영양\",\"정밀초음파\",\"임신성당뇨\",\"임신여행\"],\"date\":\"2026-04-29\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[14,15,20,23,24,27],\"authorNote\":\"$undefined\",\"canonical\":\"https://pregnancy-checklist.com/articles/mid-pregnancy-lifestyle-guide\"},{\"title\":\"임신 초기 필수 검사 총정리\",\"description\":\"임신 4주부터 13주까지 시기별 필수 검사·비용·해석법 정리. 1차 기형아 검사(NT 초음파) 정상 수치 3mm 해석과 이상 시 후속 검사 흐름, NIPT 검출률 99% vs NT 85-90% 비교(비용 30-85만 원), 국민행복카드 실질 부담액까지 담은 실전 가이드예요.\",\"slug\":\"early-pregnancy-tests\",\"tags\":[\"임신초기\",\"검사\",\"병원\",\"기형아검사\",\"NIPT\"],\"date\":\"2026-04-26\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":[5,7,9,10,11,13],\"authorNote\":\"어떤 검사를 언제 받아야 하는지 너무 헷갈렸어요. 시기별로 깔끔하게 정리해봤습니다.\",\"canonical\":\"https://pregnancy-checklist.com/articles/early-pregnancy-tests\"},{\"title\":\"태아보험, 가입 전에 꼭 따져봐야 할 5가지 (22주 넘기면 늦어요)\",\"description\":\"태아보험 가입 시기는 22주가 마지노선, 1차 기형아 검사 전이 가장 유리해요. 선천이상 수술비·인큐베이터 입원비 등 필수 특약과 빼도 되는 특약 구별법, 손해보험 vs 생명보험 차이, 30세·100세 만기 선택, 평균 보험료까지. 임신 초기 예비맘이 꼭 알아야 할 포인트를 정리했어요.\",\"slug\":\"prenatal-insurance-preparation-guide\",\"tags\":[\"태아보험\",\"임신보험\",\"태아보험가입시기\",\"태아보험특약\",\"임신준비\"],\"date\":\"2026-04-26\",\"updated\":\"$undefined\",\"linked_timeline_weeks\":\"$undefined\",\"authorNote\":\"임신 확인 이후, 병원을 갔다오고 먼저 한 일 중에 하나가 바로 태아보험 검색이었어요. 뭐가 좋은지 몰라 여러 앱에서 직접 상담하며 고르고 골랐던 걸 정리했습니다.\",\"canonical\":\"https://pregnancy-checklist.com/articles/prenatal-insurance-preparation-guide\"},{\"title\":\"임신 초기에 유난히 피곤한 진짜 이유 5가지 — 언제까지 가는지, 병원 가야 할 때는?\",\"description\":\"임신 초기에 왜 이렇게 피곤할까요? 프로게스테론 급등·혈액량 변화·혈당 불안정·hCG까지 피로의 진짜 원인 5가지와 주차별 변화 타임라인을 정리했어요. 정상 피로와 빈혈 구분 체크리스트, 직장·집에서 바로 쓸 수 있는 현실적인 관리법도 함께 담았어요.\",\"slug\":\"early-pregnancy-fatigue-reasons\",\"tags\":[\"임신초기\",\"임신피로\",\"임신
